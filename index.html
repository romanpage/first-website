<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>

  <!-- Load D3.js from CDN -->
  https://cdn.jsdelivr.net/npm/d3@7script>
</head>
<body>
  <h1>Hello World!</h1>

  <p>This is my very first website.</p>
  <p>This is <strong>my very first website.</strong></p>
  <p>This is <mark>my very first website.</mark></p>

    <h2>My First Barplot</h2>
    <div id="chart"></div>

    <script>
      const data = [120, 200, 80, 260];
      const chart = document.getElementById("chart");

      for (let i = 0; i < data.length; i++) {
        const bar = document.createElement("div");
        bar.style.width = data[i] + "px";
        bar.style.height = "30px";
        bar.style.backgroundColor = "coral";
        bar.style.marginBottom = "4px";
        chart.appendChild(bar);
      }
    </script>
</body>
</html>
