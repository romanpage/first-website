<!DOCTYPE html>
<html>
<head>
  <title>My First Website</title>

  <!-- Load D3 -->
  https://cdn.jsdelivr.net/npm/d3@7script>
</head>
<body>
  <h1>Hello World!</h1>

  <p>This is my very first website.</p>
  <p>This is <strong>my very first website.</strong></p>
  <p>This is <mark>my very first website.</mark></p>

  <h2>Bar Chart</h2>

  <div id="chart"></div>

  <script>
    const data = [
      { name: "A", value: 1 },
      { name: "B", value: 5 },
      { name: "C", value: 8 },
      { name: "D", value: 10 }
    ];

    const width = 600;
    const height = 350;
    const margin = { top: 20, right: 20, bottom: 40, left: 50 };

    const svg = d3
      .select("#chart")
      .append("svg")
      .attr("width", width)
      .attr("height", height);

    const x = d3
      .scaleBand()
      .domain(data.map(d => d.name))
      .range([margin.left, width - margin.right])
      .padding(0.2);

    const y = d3
      .scaleLinear()
      .domain([0, d3.max(data, d => d.value)])
      .nice()
      .range([height - margin.bottom, margin.top]);

    // Bars
    svg
      .selectAll("rect")
      .data(data)
      .join("rect")
      .attr("x", d => x(d.name))
      .attr("y", d => y(d.value))
      .attr("width", x.bandwidth())
      .attr("height", d => y(0) - y(d.value))
      .attr("fill", "#2563eb");

    // Labels
    svg
      .selectAll(".label")
      .data(data)
      .join("text")
      .attr("class", "label")
      .attr("x", d => x(d.name) + x.bandwidth() / 2)
      .attr("y", d => y(d.value) - 8)
      .attr("text-anchor", "middle")
      .text(d => d.value);

    // X axis
    svg
      .append("g")
      .attr("transform", `translate(0,${height - margin.bottom})`)
      .call(d3.axisBottom(x));

    // Y axis
    svg
      .append("g")
      .attr("transform", `translate(${margin.left},0)`)
      .call(d3.axisLeft(y));
  </script>
</body>
</html>
